<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌AI内容工厂</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/design-system.css">
</head>
<body>

<!-- ========== 侧边栏 ========== -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <img src="assets/logo_black.png" alt="内容宇宙" style="height: 28px; width: auto; object-fit: contain;">
    </div>
  </div>

  <nav class="nav">
    <div class="nav-section">
      <div class="nav-label">工作台</div>
      <a class="nav-item" href="/creation.html" style="text-decoration:none;color:inherit;">
        <span class="nav-icon">✨</span>
        <span>开始创作</span>
      </a>
      <div class="nav-item" data-page="assets" onclick="navigateTo('assets')">
        <span class="nav-icon">📁</span>
        <span>资产库</span>
      </div>
      <div class="nav-item" data-page="contents" onclick="navigateTo('contents')">
        <span class="nav-icon">📋</span>
        <span>已生成内容</span>
      </div>
      <div class="nav-item" data-page="brands" onclick="navigateTo('brands')">
        <span class="nav-icon">🏷️</span>
        <span>品牌管理</span>
      </div>
    </div>

    <div class="nav-separator"></div>

    <div class="nav-section">
      <div class="nav-label">内容运营</div>
      <div class="nav-item" data-page="social-media" onclick="navigateTo('social-media')">
        <span class="nav-icon">📱</span>
        <span>社媒数据</span>
      </div>
      <div class="nav-item" data-page="ad-data" onclick="navigateTo('ad-data')">
        <span class="nav-icon">📊</span>
        <span>投放数据</span>
      </div>
      <div class="nav-item" data-page="private-channel" onclick="navigateTo('private-channel')">
        <span class="nav-icon">🔗</span>
        <span>私域渠道</span>
      </div>
      <div class="nav-item" data-page="user-mgmt" onclick="navigateTo('user-mgmt')">
        <span class="nav-icon">🧠</span>
        <span>内容智能</span>
      </div>
    </div>
  </nav>
</aside>

<!-- ========== 主内容区 ========== -->
<main class="main">
  <!-- 面包屑 + 快捷操作 -->
  <div class="breadcrumb-bar">
    <div class="breadcrumb" id="breadcrumb">
      <a class="breadcrumb-item" href="/creation.html" style="text-decoration:none;color:inherit;">开始创作</a>
    </div>
    <div class="quick-actions">
      <button class="quick-btn" onclick="navigateTo('assets')">
        📁 资产库
      </button>
      <button class="quick-btn" onclick="navigateTo('brands')">
        🏷️ 品牌管理
      </button>
      <button class="quick-btn">
        ❓ 帮助
      </button>
    </div>
  </div>

  <!-- SPA 内容容器 -->
  <div class="content" id="content">
    <!-- Pages loaded here by router.js -->
  </div>
</main>

<script src="/js/router.js"></script>
</body>
</html>
