<!-- pages/user-mgmt.html — 内容智能 -->
<style>
/* --- Page header --- */
.ci-hero { background: linear-gradient(135deg, rgba(99,102,241,0.06) 0%, rgba(139,92,246,0.06) 50%, rgba(236,72,153,0.04) 100%); border-radius: var(--radius-lg); padding: 28px 32px; margin-bottom: 24px; border: 1px solid rgba(139,92,246,0.12); }
.ci-hero-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.ci-hero-sub { font-size: 13px; color: var(--text-secondary); }

/* --- Stats ribbon --- */
.ci-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.ci-stat { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 16px; text-align: center; }
.ci-stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
.ci-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* --- Chart section --- */
.ci-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.ci-chart-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; }
.ci-chart-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
.ci-chart-wrap { position: relative; height: 220px; }

/* --- Insight panel --- */
.ci-insight-section { margin-bottom: 24px; }
.ci-insight-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.ci-insight-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.ci-focus-tabs { display: flex; gap: 6px; }
.ci-focus-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 16px; font-size: 11px; font-weight: 500; color: var(--text-secondary); background: var(--surface); cursor: pointer; transition: all 0.15s; }
.ci-focus-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ci-focus-btn.active { border-color: var(--accent2); color: #fff; background: var(--accent2); }
.ci-analyze-btn { padding: 10px 28px; background: var(--gradient); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.ci-analyze-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
.ci-analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.ci-insight-body { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); min-height: 200px; overflow: hidden; }
.ci-insight-empty { padding: 60px 20px; text-align: center; color: var(--text-muted); }
.ci-insight-empty-icon { font-size: 36px; margin-bottom: 10px; }
.ci-insight-content { padding: 24px 28px; font-size: 14px; line-height: 1.8; color: var(--text); }
.ci-insight-content h2 { font-size: 16px; font-weight: 700; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-light); }
.ci-insight-content h2:first-child { margin-top: 0; }
.ci-insight-content strong { color: var(--accent2); }
.ci-insight-content ul { padding-left: 20px; margin: 8px 0; }
.ci-insight-content li { margin-bottom: 6px; }
.ci-typing-cursor { display: inline-block; width: 2px; height: 16px; background: var(--accent2); animation: blink 0.8s infinite; vertical-align: text-bottom; margin-left: 2px; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* --- Action bar --- */
.ci-actions { display: flex; gap: 10px; padding: 16px 28px; border-top: 1px solid var(--border-light); background: var(--bg); }
.ci-action-btn { padding: 8px 20px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--surface); cursor: pointer; color: var(--text-secondary); transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
.ci-action-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ci-action-btn.primary { background: var(--gradient); color: #fff; border: none; font-weight: 600; }
.ci-action-btn.primary:hover { opacity: 0.9; }

/* --- Agent placeholder --- */
.ci-agent-zone { background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 32px; text-align: center; margin-bottom: 24px; }
.ci-agent-icon { font-size: 40px; margin-bottom: 10px; }
.ci-agent-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.ci-agent-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; max-width: 480px; margin: 0 auto; }
.ci-agent-badges { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.ci-agent-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; background: rgba(139,92,246,0.08); color: var(--accent2); border: 1px solid rgba(139,92,246,0.15); }

/* --- Responsive --- */
@media (max-width: 1024px) { .ci-stats { grid-template-columns: repeat(3, 1fr); } .ci-charts { grid-template-columns: 1fr; } }
@media (max-width: 768px) { .ci-stats { grid-template-columns: repeat(2, 1fr); } }
</style>

<div class="page">
  <!-- Hero -->
  <div class="ci-hero">
    <div class="ci-hero-title">内容智能中枢</div>
    <div class="ci-hero-sub">汇聚全渠道数据，AI 驱动洞察分析，策略自动回流创作链路</div>
  </div>

  <!-- Stats ribbon -->
  <div class="ci-stats" id="ciStats"></div>

  <!-- Charts -->
  <div class="ci-charts">
    <div class="ci-chart-card">
      <div class="ci-chart-title">📦 SKU 表现对比</div>
      <div class="ci-chart-wrap"><canvas id="ciSkuChart"></canvas></div>
    </div>
    <div class="ci-chart-card">
      <div class="ci-chart-title">📱 平台数据分布</div>
      <div class="ci-chart-wrap"><canvas id="ciPlatChart"></canvas></div>
    </div>
    <div class="ci-chart-card">
      <div class="ci-chart-title">💰 投放效率对比 (ROAS)</div>
      <div class="ci-chart-wrap"><canvas id="ciRoasChart"></canvas></div>
    </div>
    <div class="ci-chart-card">
      <div class="ci-chart-title">🎬 自然流量 vs 付费流量</div>
      <div class="ci-chart-wrap"><canvas id="ciFlowChart"></canvas></div>
    </div>
  </div>

  <!-- LLM Insight -->
  <div class="ci-insight-section">
    <div class="ci-insight-header">
      <div class="ci-insight-title">🧠 AI 策略洞察</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="ci-focus-tabs">
          <button class="ci-focus-btn active" onclick="ciFocus='comprehensive';ciSyncFocus(this)">综合分析</button>
          <button class="ci-focus-btn" onclick="ciFocus='social';ciSyncFocus(this)">自然流量</button>
          <button class="ci-focus-btn" onclick="ciFocus='ad';ciSyncFocus(this)">投放优化</button>
          <button class="ci-focus-btn" onclick="ciFocus='creative';ciSyncFocus(this)">创意方向</button>
        </div>
        <button class="ci-analyze-btn" id="ciAnalyzeBtn" onclick="ciRunAnalysis()">
          <span>✨</span> 生成洞察报告
        </button>
      </div>
    </div>
    <div class="ci-insight-body" id="ciInsightBody">
      <div class="ci-insight-empty">
        <div class="ci-insight-empty-icon">🔮</div>
        <div style="font-size:14px;font-weight:600;margin-bottom:6px;">AI 洞察就绪</div>
        <div style="font-size:12.5px;">点击「生成洞察报告」，AI 将分析全渠道数据并输出可执行策略</div>
      </div>
    </div>
  </div>

  <!-- Agent Zone (placeholder) -->
  <div class="ci-agent-zone">
    <div class="ci-agent-icon">🤖</div>
    <div class="ci-agent-title">内容策略 Agent（即将上线）</div>
    <div class="ci-agent-desc">
      未来这里将接入自主决策 Agent，它能持续监控数据变化，自动生成优化策略，
      并直接调度「开始创作」生成新一轮内容 —— 真正实现数据驱动的内容飞轮。
    </div>
    <div class="ci-agent-badges">
      <span class="ci-agent-badge">数据监控</span>
      <span class="ci-agent-badge">自动分析</span>
      <span class="ci-agent-badge">策略生成</span>
      <span class="ci-agent-badge">创作调度</span>
      <span class="ci-agent-badge">效果追踪</span>
    </div>
  </div>
</div>

<script>
var ciSummary = null;
var ciFocus = 'comprehensive';
var ciCharts = {};
var ciInsightText = '';

// --- Load Chart.js lazily ---
function ciLoadChartJs() {
  return new Promise((resolve, reject) => {
    if (window.Chart) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js';
    s.onload = () => {
      // Chart.js needs a tick to register
      setTimeout(resolve, 100);
    };
    s.onerror = () => {
      console.error('Failed to load Chart.js CDN');
      reject(new Error('Chart.js load failed'));
    };
    document.head.appendChild(s);
  });
}

async function ciLoad() {
  try {
    const resp = await fetch('/api/insights/summary');
    ciSummary = await resp.json();
    if (!ciSummary.success) throw new Error('API error');
  } catch (e) { console.error('Failed to load insights:', e); return; }
  ciRenderStats();
  try {
    await ciLoadChartJs();
    // Ensure canvas elements are in DOM before rendering
    requestAnimationFrame(() => { ciRenderCharts(); });
  } catch (e) {
    console.error('Chart rendering skipped:', e);
    document.querySelectorAll('.ci-chart-wrap').forEach(el => {
      el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;">图表加载失败，请刷新重试</div>';
    });
  }
}

function ciFmt(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(Math.round(n));
}

function ciRenderStats() {
  const t = ciSummary?.totals || {};
  document.getElementById('ciStats').innerHTML = `
    <div class="ci-stat"><div class="ci-stat-value">${t.content_tasks || 0}</div><div class="ci-stat-label">AI 生成任务</div></div>
    <div class="ci-stat"><div class="ci-stat-value">${t.social_records || 0}</div><div class="ci-stat-label">社媒发布</div></div>
    <div class="ci-stat"><div class="ci-stat-value">${t.ad_campaigns || 0}</div><div class="ci-stat-label">投放计划</div></div>
    <div class="ci-stat"><div class="ci-stat-value">${ciFmt(t.total_views || 0)}</div><div class="ci-stat-label">总播放量</div></div>
    <div class="ci-stat"><div class="ci-stat-value">¥${ciFmt(t.total_spend || 0)}</div><div class="ci-stat-label">总投放消耗</div></div>`;
}

const CI_COLORS = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4'];
const PLAT_NAMES = { douyin:'抖音', xiaohongshu:'小红书', kuaishou:'快手', weixin:'视频号', bilibili:'B站', weibo:'微博', juliang:'巨量引擎', jvguang:'聚光平台', tengxun:'腾讯广告', ciliyinqing:'磁力引擎', baidu:'百度' };

function ciRenderCharts() {
  if (!window.Chart) { console.error('Chart.js not available'); return; }
  const skus = ciSummary?.sku_summary || [];
  const plats = ciSummary?.platform_summary || [];

  // Destroy existing charts
  Object.values(ciCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  ciCharts = {};

  const skuEl = document.getElementById('ciSkuChart');
  const platEl = document.getElementById('ciPlatChart');
  const roasEl = document.getElementById('ciRoasChart');
  const flowEl = document.getElementById('ciFlowChart');
  if (!skuEl || !platEl || !roasEl || !flowEl) { console.error('Canvas elements not found'); return; }

  // SKU comparison (grouped bar)
  ciCharts.sku = new Chart(skuEl, {
    type: 'bar',
    data: {
      labels: skus.map(s => s.sku),
      datasets: [
        { label: '播放量 (万)', data: skus.map(s => +(s.total_views / 10000).toFixed(1)), backgroundColor: '#6366f1', borderRadius: 4 },
        { label: '互动量 (K)', data: skus.map(s => +(s.total_interact / 1000).toFixed(1)), backgroundColor: '#8b5cf6', borderRadius: 4 },
        { label: '转化数', data: skus.map(s => s.total_conversions), backgroundColor: '#ec4899', borderRadius: 4 },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }, scales: { y: { beginAtZero: true, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } } }
  });

  // Platform distribution (doughnut)
  ciCharts.plat = new Chart(platEl, {
    type: 'doughnut',
    data: {
      labels: plats.map(p => PLAT_NAMES[p.platform] || p.platform),
      datasets: [{
        data: plats.map(p => p.social_views + p.ad_impressions),
        backgroundColor: CI_COLORS.slice(0, plats.length),
        borderWidth: 0,
      }]
    },
    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 }, padding: 12 } } } }
  });

  // ROAS comparison (horizontal bar)
  const adPlats = plats.filter(p => p.ad_spend > 0);
  ciCharts.roas = new Chart(roasEl, {
    type: 'bar',
    data: {
      labels: adPlats.map(p => PLAT_NAMES[p.platform] || p.platform),
      datasets: [{
        label: 'ROAS',
        data: adPlats.map(p => p.ad_roas),
        backgroundColor: adPlats.map(p => p.ad_roas >= 3 ? '#22c55e' : p.ad_roas >= 1 ? '#f59e0b' : '#ef4444'),
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, grid: { color: '#f0f0f0' } }, y: { grid: { display: false } } }
    }
  });

  // Organic vs Paid (mixed)
  ciCharts.flow = new Chart(flowEl, {
    type: 'bar',
    data: {
      labels: skus.map(s => s.sku),
      datasets: [
        { label: '自然播放 (万)', data: skus.map(s => +(s.total_views / 10000).toFixed(1)), backgroundColor: 'rgba(99,102,241,0.7)', borderRadius: 4, yAxisID: 'y' },
        { label: '投放消耗 (元)', data: skus.map(s => s.total_spend), backgroundColor: 'rgba(236,72,153,0.7)', borderRadius: 4, yAxisID: 'y1' },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: {
        y:  { type: 'linear', position: 'left', beginAtZero: true, grid: { color: '#f0f0f0' }, title: { display: true, text: '播放 (万)', font: { size: 10 } } },
        y1: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: '消耗 (元)', font: { size: 10 } } },
        x: { grid: { display: false } }
      }
    }
  });
}

// --- Focus tabs ---
function ciSyncFocus(btn) {
  document.querySelectorAll('.ci-focus-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// --- LLM Analysis ---
function ciBuildDataText() {
  if (!ciSummary) return '暂无数据';
  const skus = ciSummary.sku_summary || [];
  const plats = ciSummary.platform_summary || [];
  const t = ciSummary.totals || {};

  let text = `=== 数据概况 ===\nAI生成任务: ${t.content_tasks}, 社媒发布: ${t.social_records}条, 投放计划: ${t.ad_campaigns}个\n总播放: ${t.total_views}, 总投放消耗: ¥${t.total_spend}, 总转化: ${t.total_conversions}\n\n`;

  text += `=== SKU维度 ===\n`;
  skus.forEach(s => {
    text += `【${s.brand} · ${s.sku}】\n  自然: ${s.social_count}条发布, 播放${s.total_views}, 互动${s.total_interact}, 完播率${(s.avg_completion_rate*100).toFixed(1)}%\n  投放: ${s.ad_count}个计划, 消耗¥${s.total_spend}, 转化${s.total_conversions}, 加权ROAS ${s.weighted_roas}\n`;
  });

  text += `\n=== 平台维度 ===\n`;
  plats.forEach(p => {
    const name = PLAT_NAMES[p.platform] || p.platform;
    text += `【${name}】\n  自然: ${p.social_count}条, 播放${p.social_views}, 互动${p.social_interact}, 完播率${(p.avg_completion*100).toFixed(1)}%\n  投放: 消耗¥${p.ad_spend}, 展现${p.ad_impressions}, 点击${p.ad_clicks}, 转化${p.ad_conversions}, ROAS ${p.ad_roas}\n`;
  });

  return text;
}

async function ciRunAnalysis() {
  const btn = document.getElementById('ciAnalyzeBtn');
  const body = document.getElementById('ciInsightBody');
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> 分析中...';
  ciInsightText = '';

  body.innerHTML = '<div class="ci-insight-content" id="ciInsightContent"><span class="ci-typing-cursor"></span></div>';

  try {
    const resp = await fetch('/api/insights/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data_summary: ciBuildDataText(), focus: ciFocus }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const obj = JSON.parse(data);
            if (obj.text) {
              ciInsightText += obj.text;
              ciRenderInsight();
            }
            if (obj.error) {
              ciInsightText += '\n\n❌ 错误: ' + obj.error;
              ciRenderInsight();
            }
          } catch {}
        }
      }
    }
  } catch (e) {
    ciInsightText += '\n\n❌ 请求失败: ' + e.message;
  }

  ciRenderInsight(true);
  btn.disabled = false;
  btn.innerHTML = '<span>✨</span> 重新生成';
}

function ciRenderInsight(final) {
  const el = document.getElementById('ciInsightContent');
  if (!el) return;
  // Simple markdown-ish rendering
  let html = ciInsightText
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/gs, m => '<ul>' + m + '</ul>')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '<br>');
  el.innerHTML = html + (final ? '' : '<span class="ci-typing-cursor"></span>');

  // Show action bar after completion
  if (final && ciInsightText.length > 50) {
    const existing = document.querySelector('.ci-actions');
    if (!existing) {
      const bar = document.createElement('div');
      bar.className = 'ci-actions';
      bar.innerHTML = `
        <button class="ci-action-btn primary" onclick="ciJumpToCreation()">🚀 基于策略创作新内容</button>
        <button class="ci-action-btn" onclick="ciCopyInsight()">📋 复制报告</button>
        <button class="ci-action-btn" onclick="ciRunAnalysis()">🔄 重新分析</button>`;
      document.getElementById('ciInsightBody').appendChild(bar);
    }
  }

  // Auto scroll
  el.scrollTop = el.scrollHeight;
}

function ciJumpToCreation() {
  // Extract the actionable strategy from insight text — find content after "下一步行动"
  let prompt = '';
  const match = ciInsightText.match(/下一步行动[\s\S]*?((?:^|\n)[-·•][\s\S]*)/m);
  if (match) {
    prompt = match[1].replace(/^[-·•\s]+/gm, '').replace(/\*\*/g, '').trim().split('\n').filter(l => l.trim()).join('\n');
  }
  if (!prompt) {
    // Fallback: use the whole insight as context
    prompt = '基于数据洞察优化创作方向';
  }
  // Store in sessionStorage for creation page to pick up
  sessionStorage.setItem('ci_strategy_prompt', prompt);
  sessionStorage.setItem('ci_strategy_full', ciInsightText);
  window.location.href = '/creation.html#from-insight';
}

function ciCopyInsight() {
  navigator.clipboard.writeText(ciInsightText).then(() => {
    const btn = event.target;
    btn.textContent = '✅ 已复制';
    setTimeout(() => { btn.textContent = '📋 复制报告'; }, 1500);
  });
}

// Init
ciLoad();
</script>
