<!-- pages/ad-data.html — 投放数据 -->
<style>
/* --- KPI --- */
.ad-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.ad-kpi-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; }
.ad-kpi-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.ad-kpi-value { font-size: 24px; font-weight: 700; color: var(--text); }
.ad-kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* --- Filter bar --- */
.ad-filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.ad-plat-btn { padding: 5px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-secondary); background: var(--surface); cursor: pointer; transition: all 0.15s; }
.ad-plat-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ad-plat-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(139,92,246,0.08); font-weight: 600; }

/* --- Table --- */
.ad-table-wrap { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 320px); }
.ad-table-wrap table { width: 100%; border-collapse: collapse; }
.ad-table-wrap thead { background: var(--bg); }
.ad-table-wrap th { padding: 10px 12px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; background: var(--bg); position: sticky; top: 0; z-index: 2; }
.ad-table-wrap th:hover { color: var(--text); }
.ad-table-wrap th .sort-icon { font-size: 10px; margin-left: 2px; opacity: 0.4; }
.ad-table-wrap th.sorted .sort-icon { opacity: 1; color: var(--accent2); }
.ad-table-wrap td { padding: 10px 12px; font-size: 12.5px; color: var(--text); border-top: 1px solid var(--border-light); vertical-align: middle; }
.ad-table-wrap tr:hover td { background: var(--bg); }

/* --- Content cell --- */
.ad-content-cell { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.ad-thumb { width: 40px; height: 54px; border-radius: 5px; overflow: hidden; background: #f0f0f0; flex-shrink: 0; }
.ad-thumb video { width: 100%; height: 100%; object-fit: cover; }
.ad-content-info { min-width: 0; }
.ad-content-title { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.ad-content-tags { display: flex; gap: 4px; margin-top: 2px; }
.ad-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #f3f4f6; color: #6b7280; }
.ad-tag.brand { background: #ede9fe; color: #7c3aed; }

/* --- Platform badge --- */
.ad-plat-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.ad-plat-icon { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }

/* --- ROAS chip --- */
.ad-roas { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.ad-roas-high { background: #dcfce7; color: #15803d; }
.ad-roas-mid  { background: #fef3c7; color: #b45309; }
.ad-roas-low  { background: #fee2e2; color: #dc2626; }

/* --- Actions --- */
.ad-actions { display: flex; gap: 4px; }
.ad-act-btn { padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; background: var(--surface); cursor: pointer; color: var(--text-secondary); transition: all 0.15s; }
.ad-act-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ad-act-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

/* --- Modal --- */
.ad-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; }
.ad-modal-overlay.show { display: flex; }
.ad-modal { background: #fff; border-radius: 16px; width: 600px; max-height: 85vh; overflow-y: auto; padding: 28px; box-shadow: var(--shadow-lg); }
.ad-modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.ad-form-group { margin-bottom: 14px; }
.ad-form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; display: block; }
.ad-form-input, .ad-form-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); box-sizing: border-box; }
.ad-form-input:focus, .ad-form-select:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
.ad-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ad-form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.ad-btn-primary { padding: 10px 24px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.ad-btn-primary:hover { opacity: 0.9; }
.ad-btn-ghost { padding: 10px 24px; background: none; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text-secondary); }
.ad-modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* --- Num --- */
.ad-num { font-variant-numeric: tabular-nums; }
.ad-num-bold { font-weight: 600; }

/* --- Empty --- */
.ad-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.ad-empty-icon { font-size: 40px; margin-bottom: 12px; }

/* --- Chat panel --- */
.ad-chat-panel { background: var(--surface); border: 1px solid var(--border-light); border-radius: 12px; margin-top: 16px; box-shadow: 0 -2px 8px rgba(0,0,0,0.03); }
.ad-chat-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; user-select: none; }
.ad-chat-header h3 { font-size: 13px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 6px; }
.ad-chat-body { display: none; max-height: 280px; overflow-y: auto; padding: 0 16px 12px; }
.ad-chat-body.open { display: block; }
.ad-chat-input-row { display: none; gap: 8px; padding: 0 16px 12px; }
.ad-chat-input-row.open { display: flex; }
.ad-chat-input-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); }
.ad-chat-input-row input:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
.ad-chat-msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.ad-chat-msg.user { background: rgba(139,92,246,0.08); margin-left: 40px; }
.ad-chat-msg.ai { background: var(--bg); margin-right: 20px; }

@media (max-width: 1024px) { .ad-kpi-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .ad-kpi-grid { grid-template-columns: 1fr; } }
</style>

<script>
var adRecords = [];
var adContentTasks = [];
var adPlatformFilter = null;
var adSortKey = 'metrics.spend';
var adSortAsc = false;

const AD_PLATFORMS = {
  juliang:      { name: '巨量引擎', color: '#fe2c55', icon: '巨' },
  jvguang:      { name: '聚光平台', color: '#ff2442', icon: '聚' },
  tengxun:      { name: '腾讯广告', color: '#07c160', icon: '腾' },
  ciliyinqing:  { name: '磁力引擎', color: '#ff6600', icon: '磁' },
  bilibili:     { name: 'B站花火', color: '#00a1d6', icon: 'B' },
  baidu:        { name: '百度信息流', color: '#306cff', icon: '百' },
};

async function adLoad() {
  try {
    const [adResp, taskResp] = await Promise.all([
      fetch('/api/ad-campaigns').then(r => r.json()),
      fetch('/api/content-tasks').then(r => r.json()),
    ]);
    if (adResp.success) adRecords = adResp.records;
    if (taskResp.success) adContentTasks = taskResp.tasks;
  } catch (e) { console.error('Failed to load ad data:', e); }
  adRenderKpi();
  adRender();
}

function adFmt(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(Math.round(n * 100) / 100);
}

function adMoney(n) {
  if (n >= 10000) return '¥' + (n / 10000).toFixed(2) + '万';
  return '¥' + n.toFixed(2);
}

function adRenderKpi() {
  const grid = document.getElementById('adKpiGrid');
  const r = adRecords;
  const totalSpend = r.reduce((s, x) => s + (x.metrics?.spend || 0), 0);
  const totalImpr = r.reduce((s, x) => s + (x.metrics?.impressions || 0), 0);
  const totalClicks = r.reduce((s, x) => s + (x.metrics?.clicks || 0), 0);
  const avgCtr = totalImpr > 0 ? (totalClicks / totalImpr * 100) : 0;
  const totalConv = r.reduce((s, x) => s + (x.metrics?.conversions || 0), 0);
  const weightedRoas = r.length > 0
    ? r.reduce((s, x) => s + (x.metrics?.roas || 0) * (x.metrics?.spend || 0), 0) / (totalSpend || 1)
    : 0;

  grid.innerHTML = `
    <div class="ad-kpi-card">
      <div class="ad-kpi-label">总消耗</div>
      <div class="ad-kpi-value">${adMoney(totalSpend)}</div>
      <div class="ad-kpi-sub">${r.length} 个投放计划</div>
    </div>
    <div class="ad-kpi-card">
      <div class="ad-kpi-label">总展现</div>
      <div class="ad-kpi-value">${adFmt(totalImpr)}</div>
      <div class="ad-kpi-sub">总点击 ${adFmt(totalClicks)}</div>
    </div>
    <div class="ad-kpi-card">
      <div class="ad-kpi-label">平均 CTR</div>
      <div class="ad-kpi-value">${avgCtr.toFixed(2)}%</div>
      <div class="ad-kpi-sub">总转化 ${adFmt(totalConv)}</div>
    </div>
    <div class="ad-kpi-card">
      <div class="ad-kpi-label">加权 ROAS</div>
      <div class="ad-kpi-value" style="color:${weightedRoas >= 3 ? '#15803d' : weightedRoas >= 1 ? '#b45309' : '#dc2626'}">${weightedRoas.toFixed(2)}</div>
      <div class="ad-kpi-sub">按消耗加权</div>
    </div>`;
}

function adFilterPlatform(platform, btn) {
  adPlatformFilter = platform;
  document.querySelectorAll('.ad-plat-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  adRender();
}

function adSort(key) {
  if (adSortKey === key) adSortAsc = !adSortAsc;
  else { adSortKey = key; adSortAsc = false; }
  adRender();
}

function adGetVal(rec, key) {
  if (key.startsWith('metrics.')) return rec.metrics?.[key.replace('metrics.', '')] || 0;
  if (key === 'date_start') return rec.date_start || '';
  if (key === 'budget') return rec.budget || 0;
  return 0;
}

function adRender() {
  const wrap = document.getElementById('adTableWrap');
  const brandFilter = document.getElementById('adBrandFilter').value;

  let filtered = adRecords.slice();
  if (adPlatformFilter) filtered = filtered.filter(r => r.platform === adPlatformFilter);
  if (brandFilter) filtered = filtered.filter(r => r.brand === brandFilter);

  filtered.sort((a, b) => {
    const va = adGetVal(a, adSortKey), vb = adGetVal(b, adSortKey);
    let cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    return adSortAsc ? cmp : -cmp;
  });

  if (filtered.length === 0) {
    wrap.innerHTML = `<div class="ad-empty">
      <div class="ad-empty-icon">💰</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:8px;">暂无投放数据</div>
      <div style="font-size:13px;">点击「录入投放数据」或「CSV 导入」添加记录</div>
    </div>`;
    return;
  }

  const cols = [
    { key: null, label: '素材', w: '' },
    { key: null, label: '平台', w: '80px' },
    { key: null, label: '计划', w: '130px' },
    { key: 'metrics.spend', label: '消耗', w: '80px' },
    { key: 'metrics.impressions', label: '展现', w: '75px' },
    { key: 'metrics.clicks', label: '点击', w: '60px' },
    { key: 'metrics.ctr', label: 'CTR', w: '58px' },
    { key: 'metrics.cpc', label: 'CPC', w: '60px' },
    { key: 'metrics.cpm', label: 'CPM', w: '60px' },
    { key: 'metrics.conversions', label: '转化', w: '55px' },
    { key: 'metrics.cvr', label: 'CVR', w: '58px' },
    { key: 'metrics.cpa', label: 'CPA', w: '65px' },
    { key: 'metrics.gmv', label: 'GMV', w: '80px' },
    { key: 'metrics.roas', label: 'ROAS', w: '65px' },
    { key: 'metrics.gpm', label: 'GPM', w: '65px' },
    { key: null, label: '操作', w: '100px' },
  ];

  let html = '<table><thead><tr>';
  cols.forEach(c => {
    const sorted = c.key === adSortKey;
    const arrow = c.key ? (sorted ? (adSortAsc ? '▲' : '▼') : '▲') : '';
    html += `<th${sorted ? ' class="sorted"' : ''}${c.key ? ` onclick="adSort('${c.key}')"` : ''}${c.w ? ` style="width:${c.w}"` : ''}>${c.label}${arrow ? `<span class="sort-icon">${arrow}</span>` : ''}</th>`;
  });
  html += '</tr></thead><tbody>';

  filtered.forEach(r => {
    const p = AD_PLATFORMS[r.platform] || { name: r.platform, color: '#999', icon: '?' };
    const m = r.metrics || {};
    const roas = m.roas || 0;
    const roasCls = roas >= 3 ? 'ad-roas-high' : roas >= 1 ? 'ad-roas-mid' : 'ad-roas-low';

    const playUrl = r.published_url || r.extra?.['播放链接'] || '';
    const thumbContent = r.video_url
      ? `<div class="ad-thumb"><video src="${adEsc(r.video_url)}" muted preload="metadata"></video></div>`
      : '<div class="ad-thumb" style="display:flex;align-items:center;justify-content:center;font-size:14px;">🎬</div>';
    const titleText = adEsc(r.title || r.creative_name || '未命名');
    const linkWrap = (inner) => playUrl ? `<a href="${adEsc(playUrl)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;">${inner}</a>` : inner;
    // Show account_name for千川 data, otherwise brand/sku tags
    const isQc = r.extra?.['作品ID'];
    const subtag = isQc
      ? (r.account_name ? `<span class="ad-tag brand">${adEsc(r.account_name)}</span>` : '')
      : `${r.brand ? `<span class="ad-tag brand">${adEsc(r.brand)}</span>` : ''}${r.sku ? `<span class="ad-tag">${adEsc(r.sku)}</span>` : ''}`;
    // Campaign/date: if no distinct range, just show date_start
    const dateDisplay = (r.date_end && r.date_end !== r.date_start)
      ? `${adEsc(r.date_start)} ~ ${adEsc(r.date_end)}`
      : adEsc(r.date_start || '');
    const campaignDisplay = (isQc || !r.campaign_name || r.campaign_name === r.title?.slice(0, 40))
      ? dateDisplay
      : `<div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;" title="${adEsc(r.campaign_name)}">${adEsc(r.campaign_name)}</div><div style="color:var(--text-muted);font-size:11px;">${dateDisplay}</div>`;

    html += `<tr>
      <td><div class="ad-content-cell">
        ${linkWrap(thumbContent)}
        <div class="ad-content-info">
          <div class="ad-content-title" title="${adEsc(r.title)}">${linkWrap(titleText)}</div>
          <div class="ad-content-tags">${subtag}</div>
        </div>
      </div></td>
      <td><div class="ad-plat-badge"><span class="ad-plat-icon" style="background:${p.color}">${p.icon}</span>${p.name}</div></td>
      <td><div style="font-size:12px;">${campaignDisplay}</div></td>
      <td class="ad-num ad-num-bold">${adMoney(m.spend || 0)}</td>
      <td class="ad-num">${adFmt(m.impressions || 0)}</td>
      <td class="ad-num">${adFmt(m.clicks || 0)}</td>
      <td class="ad-num" style="font-weight:500;">${((m.ctr || 0) * 100).toFixed(2)}%</td>
      <td class="ad-num">¥${(m.cpc || 0).toFixed(2)}</td>
      <td class="ad-num">¥${(m.cpm || 0).toFixed(1)}</td>
      <td class="ad-num">${adFmt(m.conversions || 0)}</td>
      <td class="ad-num" style="font-weight:500;">${((m.cvr || 0) * 100).toFixed(2)}%</td>
      <td class="ad-num">¥${(m.cpa || 0).toFixed(1)}</td>
      <td class="ad-num ad-num-bold">${adMoney(m.gmv || 0)}</td>
      <td><span class="ad-roas ${roasCls}">${roas.toFixed(2)}</span></td>
      <td class="ad-num">¥${(m.gpm || 0).toFixed(1)}</td>
      <td><div class="ad-actions">
        <button class="ad-act-btn" onclick="adEdit('${r.campaign_id}')">编辑</button>
        <button class="ad-act-btn danger" onclick="adDelete('${r.campaign_id}')">删</button>
      </div></td>
    </tr>`;
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// --- Modal ---
function adShowModal(editRec) {
  const overlay = document.getElementById('adModalOverlay');
  document.getElementById('adModalTitle').textContent = editRec ? '编辑投放数据' : '录入投放数据';
  document.getElementById('adEditId').value = editRec?.campaign_id || '';

  const sel = document.getElementById('adTaskSelect');
  sel.innerHTML = '<option value="">选择已完成的任务...</option>';
  adContentTasks.filter(t => t.status === 'completed').forEach(t => {
    sel.innerHTML += `<option value="${t.task_id}" ${editRec?.task_id === t.task_id ? 'selected' : ''}>${adEsc(t.title)} (${adEsc(t.brand)} ${adEsc(t.sku)})</option>`;
  });

  if (editRec) {
    document.getElementById('adPlatform').value = editRec.platform || 'juliang';
    document.getElementById('adAccount').value = editRec.account_name || '';
    document.getElementById('adCampaignName').value = editRec.campaign_name || '';
    document.getElementById('adCreativeName').value = editRec.creative_name || '';
    document.getElementById('adDateStart').value = editRec.date_start || '';
    document.getElementById('adDateEnd').value = editRec.date_end || '';
    document.getElementById('adBudget').value = editRec.budget || 0;
    document.getElementById('adSpend').value = editRec.metrics?.spend || 0;
    document.getElementById('adImpressions').value = editRec.metrics?.impressions || 0;
    document.getElementById('adClicks').value = editRec.metrics?.clicks || 0;
    document.getElementById('adConversions').value = editRec.metrics?.conversions || 0;
    document.getElementById('adGmv').value = editRec.metrics?.gmv || 0;
    document.getElementById('adRoas').value = editRec.metrics?.roas || 0;
    document.getElementById('adViews').value = editRec.metrics?.views || 0;
    document.getElementById('adNotes').value = editRec.notes || '';
  } else {
    ['adAccount','adCampaignName','adCreativeName','adNotes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('adPlatform').value = 'juliang';
    document.getElementById('adDateStart').value = new Date().toISOString().slice(0, 10);
    document.getElementById('adDateEnd').value = '';
    ['adBudget','adSpend','adImpressions','adClicks','adConversions','adRoas','adGmv','adViews'].forEach(id => document.getElementById(id).value = '');
  }
  overlay.classList.add('show');
}

function adCloseModal() { document.getElementById('adModalOverlay').classList.remove('show'); }

async function adSave() {
  const editId = document.getElementById('adEditId').value;
  const spend = parseFloat(document.getElementById('adSpend').value) || 0;
  const impressions = parseInt(document.getElementById('adImpressions').value) || 0;
  const clicks = parseInt(document.getElementById('adClicks').value) || 0;
  const conversions = parseInt(document.getElementById('adConversions').value) || 0;

  const data = {
    task_id: document.getElementById('adTaskSelect').value,
    platform: document.getElementById('adPlatform').value,
    account_name: document.getElementById('adAccount').value,
    campaign_name: document.getElementById('adCampaignName').value,
    creative_name: document.getElementById('adCreativeName').value,
    date_start: document.getElementById('adDateStart').value,
    date_end: document.getElementById('adDateEnd').value,
    budget: parseFloat(document.getElementById('adBudget').value) || 0,
    metrics: {
      spend: spend,
      impressions: impressions,
      clicks: clicks,
      conversions: conversions,
      gmv: parseFloat(document.getElementById('adGmv').value) || 0,
      views: parseInt(document.getElementById('adViews').value) || 0,
      roas: parseFloat(document.getElementById('adRoas').value) || 0,
    },
    notes: document.getElementById('adNotes').value,
  };

  try {
    const url = editId ? `/api/ad-campaigns/${editId}` : '/api/ad-campaigns';
    const method = editId ? 'PUT' : 'POST';
    const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const result = await resp.json();
    if (result.success) { adCloseModal(); await adLoad(); }
    else alert('保存失败: ' + JSON.stringify(result));
  } catch (e) { alert('保存失败: ' + e.message); }
}

function adEdit(cid) {
  const rec = adRecords.find(r => r.campaign_id === cid);
  if (rec) adShowModal(rec);
}

async function adDelete(cid) {
  if (!confirm('确认删除这条投放记录？')) return;
  try {
    const resp = await fetch(`/api/ad-campaigns/${cid}`, { method: 'DELETE' });
    const result = await resp.json();
    if (result.success) await adLoad();
  } catch (e) { alert('删除失败: ' + e.message); }
}

// --- CSV ---
function adShowCsvImport() {
  document.getElementById('adCsvOverlay').classList.add('show');
  document.getElementById('adAiChat').style.display = 'none';
  document.getElementById('adAiChat').innerHTML = '';
  document.getElementById('adCsvUploadArea').style.display = '';
  document.getElementById('adCsvImportBtn').disabled = false;
  document.getElementById('adCsvImportBtn').textContent = '开始导入';
  document.getElementById('adCsvImportBtn').onclick = adImportCsv;
  document.getElementById('adCsvCancelBtn').style.display = '';
}
function adCloseCsv() { if (!adImporting) document.getElementById('adCsvOverlay').classList.remove('show'); }

var adImporting = false;

function adAppendChat(html, cls) {
  const chat = document.getElementById('adAiChat');
  const div = document.createElement('div');
  div.style.marginBottom = '6px';
  if (cls) div.className = cls;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function adImportCsv() {
  const fileInput = document.getElementById('adCsvFile');
  if (!fileInput.files.length) { alert('请选择 CSV 文件'); return; }

  adImporting = true;
  const chat = document.getElementById('adAiChat');
  chat.style.display = 'block';
  chat.innerHTML = '';
  document.getElementById('adCsvImportBtn').disabled = true;
  document.getElementById('adCsvImportBtn').textContent = '处理中...';
  document.getElementById('adCsvUploadArea').style.display = 'none';

  adAppendChat('📤 <strong>开始上传文件...</strong>');

  const fd = new FormData();
  fd.append('file', fileInput.files[0]);

  try {
    const resp = await fetch('/api/import/smart-csv?target=ad', { method: 'POST', body: fd });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let summaryText = '';
    let summaryEl = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const obj = JSON.parse(data);
          if (obj.event === 'progress') {
            adAppendChat(obj.text);
          } else if (obj.event === 'mapping') {
            adAppendChat(`🎯 <strong>平台: ${obj.platform}</strong> | 映射 ${obj.mapped} 字段 | ${obj.unmapped_count} 个未映射`, '');
          } else if (obj.event === 'result') {
            const s = obj.stats || {};
            let statsHtml = `<div style="margin:8px 0;padding:10px 14px;background:var(--surface);border:1px solid var(--border-light);border-radius:8px;">`;
            statsHtml += `<div style="font-weight:700;margin-bottom:6px;">📊 入库统计</div>`;
            statsHtml += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px;">`;
            statsHtml += `<span>导入记录: <strong>${obj.imported_count}</strong></span>`;
            statsHtml += `<span>衍生指标: <strong>${obj.derived_count}</strong> 条</span>`;
            if (s.total_spend) statsHtml += `<span>总消耗: <strong>¥${s.total_spend.toFixed(0)}</strong></span>`;
            if (s.total_impressions) statsHtml += `<span>总展现: <strong>${(s.total_impressions/10000).toFixed(1)}万</strong></span>`;
            if (s.total_clicks) statsHtml += `<span>总点击: <strong>${s.total_clicks.toFixed(0)}</strong></span>`;
            if (s.total_conversions) statsHtml += `<span>总转化: <strong>${s.total_conversions.toFixed(0)}</strong></span>`;
            if (s.avg_roas) statsHtml += `<span>平均ROAS: <strong>${s.avg_roas.toFixed(2)}</strong></span>`;
            statsHtml += `</div></div>`;
            adAppendChat(statsHtml);
          } else if (obj.event === 'summary') {
            if (!summaryEl) {
              adAppendChat('<div style="margin-top:8px;padding:12px 14px;background:linear-gradient(135deg,rgba(99,102,241,0.06),rgba(139,92,246,0.06));border:1px solid rgba(139,92,246,0.15);border-radius:8px;"><div style="font-weight:700;margin-bottom:6px;">🧠 AI 分析</div><div id="adSummaryContent" style="font-size:12.5px;line-height:1.7;"></div></div>');
              summaryEl = document.getElementById('adSummaryContent');
            }
            summaryText += obj.text;
            summaryEl.innerHTML = summaryText
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\n/g, '<br>');
            chat.scrollTop = chat.scrollHeight;
          } else if (obj.event === 'error') {
            adAppendChat(`❌ <span style="color:#dc2626;">${obj.message}</span>`);
          }
        } catch {}
      }
    }
  } catch (e) {
    adAppendChat(`❌ <span style="color:#dc2626;">请求失败: ${e.message}</span>`);
  }

  adImporting = false;
  const btn = document.getElementById('adCsvImportBtn');
  btn.disabled = false;
  btn.textContent = '完成';
  btn.onclick = async () => { adCloseCsv(); await adLoad(); };
  document.getElementById('adCsvCancelBtn').style.display = 'none';
}

function adEsc(t) {
  if (!t) return '';
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- AI Chat Panel ---
var adChatMessages = [];
var adChatOpen = false;
var adChatStreaming = false;

function adToggleChat() {
  adChatOpen = !adChatOpen;
  document.getElementById('adChatBody').classList.toggle('open', adChatOpen);
  document.getElementById('adChatInputRow').classList.toggle('open', adChatOpen);
  document.getElementById('adChatToggle').textContent = adChatOpen ? '收起 ▴' : '展开 ▾';
  if (adChatOpen) document.getElementById('adChatInput').focus();
}

function adRenderChat() {
  const body = document.getElementById('adChatBody');
  body.innerHTML = adChatMessages.map(m => {
    let html = adEsc(m.content).replace(/\n/g, '<br>').replace(/&lt;!--ACTION:.*?--&gt;/g, '');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return `<div class="ad-chat-msg ${m.role === 'user' ? 'user' : 'ai'}">${html || '<span style="color:var(--text-muted);">思考中...</span>'}</div>`;
  }).join('');
  body.scrollTop = body.scrollHeight;
}

async function adSendChat() {
  if (adChatStreaming) return;
  const input = document.getElementById('adChatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  adChatMessages.push({ role: 'user', content: text });
  adChatMessages.push({ role: 'assistant', content: '' });
  adRenderChat();
  adChatStreaming = true;

  try {
    const resp = await fetch('/api/data-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: adChatMessages.filter(m => m.content), page: 'ad' })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const obj = JSON.parse(data);
          if (obj.text) {
            adChatMessages[adChatMessages.length - 1].content += obj.text;
            adRenderChat();
          }
          if (obj.actions_executed) {
            await adLoad();
          }
        } catch {}
      }
    }
  } catch (e) {
    adChatMessages[adChatMessages.length - 1].content += '\n⚠️ 请求失败: ' + e.message;
    adRenderChat();
  }
  adChatStreaming = false;
}

adLoad();
</script>
