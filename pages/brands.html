<!-- pages/brands.html — 品牌管理 (products.md 双向联动) -->
<style>
.brand-page { max-width: 1100px; margin: 0 auto; }
.brand-hero {
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 60%, #2a1f0a 100%);
  border-radius: 16px; padding: 32px; margin-bottom: 24px; color: #fff; display: flex; align-items: center; gap: 32px;
}
.brand-hero-logo { width: 88px; height: 88px; background: #000; border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(212,175,105,0.3); flex-shrink: 0; }
.brand-hero-logo span { font-size: 28px; font-weight: 800; color: #d4af69; letter-spacing: 2px; }
.brand-hero-info { flex: 1; }
.brand-hero-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.brand-hero-name em { font-style: normal; color: #d4af69; font-size: 14px; margin-left: 8px; font-weight: 500; }
.brand-hero-slogan { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 2px; margin-bottom: 12px; }
.brand-hero-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.brand-hero-tag { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; background: rgba(212,175,105,0.15); color: #d4af69; border: 1px solid rgba(212,175,105,0.25); }

.brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.brand-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: 14px; padding: 24px; }
.brand-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.brand-card-full { grid-column: 1 / -1; }

/* VI Colors */
.vi-colors { display: flex; gap: 12px; flex-wrap: wrap; }
.vi-color-chip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg); border-radius: 8px; flex: 1; min-width: 140px; }
.vi-color-swatch { width: 36px; height: 36px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); flex-shrink: 0; }
.vi-color-name { font-size: 11px; color: var(--text-secondary); }
.vi-color-hex { font-size: 13px; font-weight: 600; font-family: monospace; }

/* Brand personality */
.personality-list { display: flex; gap: 12px; }
.personality-item { flex: 1; padding: 14px; background: var(--bg); border-radius: 10px; }
.personality-item strong { display: block; font-size: 14px; margin-bottom: 4px; }
.personality-item span { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }

/* Products layout */
.products-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; margin-top: 24px; }
.sku-sidebar { display: flex; flex-direction: column; gap: 6px; }
.sku-group-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; padding: 8px 10px 4px; }
.sku-sidebar-item { padding: 10px 14px; background: var(--surface); border: 1px solid var(--border-light); border-radius: 10px; cursor: pointer; transition: all 0.15s; }
.sku-sidebar-item:hover { border-color: var(--primary); }
.sku-sidebar-item.active { border-color: #d4af69; background: linear-gradient(135deg, rgba(212,175,105,0.08), transparent); }
.sku-sidebar-item .sku-name { font-size: 13px; font-weight: 600; }
.sku-sidebar-item .sku-nick { font-size: 10px; color: #d4af69; margin-top: 2px; }
.sku-add-btn { padding: 10px 14px; background: var(--surface); border: 1px dashed var(--border-light); border-radius: 10px; cursor: pointer; text-align: center; font-size: 12px; color: var(--text-muted); transition: all 0.15s; }
.sku-add-btn:hover { border-color: #d4af69; color: #d4af69; }

/* SKU Detail */
.sku-detail { min-height: 400px; }
.sku-detail-empty { padding: 80px 20px; text-align: center; color: var(--text-muted); }
.sku-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.sku-title { font-size: 20px; font-weight: 700; }
.sku-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.sku-series-badge { padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(212,175,105,0.12); color: #d4af69; border: 1px solid rgba(212,175,105,0.2); }

.sku-section { margin-bottom: 20px; }
.sku-section-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.sku-field { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px; background: var(--bg); border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
.sku-field-label { font-weight: 600; color: var(--text-secondary); min-width: 70px; flex-shrink: 0; font-size: 11px; }
.sku-field-value { flex: 1; line-height: 1.6; }
.sku-field-edit { opacity: 0; cursor: pointer; font-size: 12px; transition: opacity 0.15s; flex-shrink: 0; }
.sku-field:hover .sku-field-edit { opacity: 0.6; }
.sku-field-edit:hover { opacity: 1 !important; }

.sku-selling-points { list-style: none; padding: 0; margin: 0; }
.sku-selling-points li { padding: 8px 12px; background: var(--bg); border-radius: 8px; margin-bottom: 4px; font-size: 13px; line-height: 1.6; display: flex; align-items: baseline; gap: 8px; }
.sku-selling-points li::before { content: '•'; color: #d4af69; font-weight: 700; flex-shrink: 0; }

.sku-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sku-table th { background: var(--bg); padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border-light); }
.sku-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-light); line-height: 1.5; }
.sku-table tr:last-child td { border-bottom: none; }

.sku-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.sku-tag { padding: 3px 10px; border-radius: 4px; font-size: 11px; background: rgba(212,175,105,0.1); color: #d4af69; border: 1px solid rgba(212,175,105,0.15); }

/* Inline edit */
.sku-inline-input { width: 100%; background: var(--surface); border: 1px solid #d4af69; border-radius: 6px; padding: 6px 10px; font-size: 13px; color: var(--text); outline: none; font-family: inherit; }
textarea.sku-inline-input { min-height: 60px; resize: vertical; }

/* Add SKU modal */
.sku-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.sku-modal-overlay.show { display: flex; }
.sku-modal { background: var(--surface); border-radius: 16px; padding: 28px; width: 500px; max-height: 80vh; overflow-y: auto; }
.sku-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.sku-modal label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
.sku-modal input, .sku-modal textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border-light); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; margin-bottom: 12px; font-family: inherit; box-sizing: border-box; }
.sku-modal textarea { min-height: 60px; resize: vertical; }
.sku-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.sku-modal-actions button { padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-light); background: var(--bg); color: var(--text); }
.sku-modal-actions .primary { background: #d4af69; color: #000; border-color: #d4af69; }
</style>

<div class="brand-page">
  <div class="page-header">
    <h1 class="page-title">品牌管理</h1>
    <p class="page-subtitle">产品知识库实时同步自 products.md · 编辑即写回 · 小源共享调用</p>
  </div>

  <!-- Brand Hero -->
  <div class="brand-hero">
    <div class="brand-hero-logo"><span>RHC</span></div>
    <div class="brand-hero-info">
      <div class="brand-hero-name">人源活力®<em>Recombinant Human Collagen</em></div>
      <div class="brand-hero-slogan">KEEP COLLAGEN KEEP YOUNG</div>
      <div class="brand-hero-tags">
        <span class="brand-hero-tag">透皮重组胶原蛋白领先品牌</span>
        <span class="brand-hero-tag">专利 ZL2018 1 1590564.X</span>
        <span class="brand-hero-tag">聚源生物旗下</span>
        <span class="brand-hero-tag">2021年创立</span>
      </div>
    </div>
  </div>

  <!-- Brand info cards -->
  <div class="brand-grid">
    <div class="brand-card">
      <h3>🧬 品牌个性</h3>
      <div class="personality-list">
        <div class="personality-item"><strong>专注</strong><span>18年深研重组化胶原</span></div>
        <div class="personality-item"><strong>科学</strong><span>坚信自主研发创新突破</span></div>
        <div class="personality-item"><strong>有效</strong><span>每个配方数据化验证</span></div>
      </div>
    </div>
    <div class="brand-card">
      <h3>🎨 品牌VI</h3>
      <div class="vi-colors">
        <div class="vi-color-chip"><div class="vi-color-swatch" style="background:#d4af69;"></div><div><div class="vi-color-name">品牌金</div><div class="vi-color-hex">#D4AF69</div></div></div>
        <div class="vi-color-chip"><div class="vi-color-swatch" style="background:#1a1a1a;"></div><div><div class="vi-color-name">品牌黑</div><div class="vi-color-hex">#1A1A1A</div></div></div>
        <div class="vi-color-chip"><div class="vi-color-swatch" style="background:#f5f0e8;border-color:var(--border);"></div><div><div class="vi-color-name">米白底</div><div class="vi-color-hex">#F5F0E8</div></div></div>
      </div>
    </div>
  </div>

  <!-- Products section: dynamic from products.md -->
  <div class="brand-card brand-card-full" style="padding:0;overflow:hidden;">
    <div style="padding:20px 24px 0;"><h3>📦 产品知识库 <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px;" id="skuCount"></span></h3></div>
    <div class="products-layout" style="padding:0 24px 24px;">
      <div>
        <div class="sku-sidebar" id="skuSidebar"></div>
        <div class="sku-add-btn" onclick="skuShowAddModal()" style="margin-top:8px;">+ 添加 SKU</div>
      </div>
      <div class="sku-detail" id="skuDetail">
        <div class="sku-detail-empty">
          <div style="font-size:36px;margin-bottom:10px;">📋</div>
          <div>加载中...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add SKU Modal -->
<div class="sku-modal-overlay" id="skuModalOverlay" onclick="if(event.target===this)skuCloseModal()">
  <div class="sku-modal">
    <h3>添加新 SKU</h3>
    <label>SKU 全名（如：紧塑童颜水光精华液（精雕瓶））</label>
    <input id="newSkuName" placeholder="产品全名">
    <label>电商昵称</label>
    <input id="newSkuNick" placeholder="如：精雕瓶">
    <label>系列</label>
    <input id="newSkuSeries" placeholder="如：鎏金超导系列">
    <label>核心技术</label>
    <input id="newSkuTech" placeholder="核心技术描述">
    <label>形态</label>
    <input id="newSkuForm" placeholder="如：精华液、面膜">
    <label>核心卖点（每行一条）</label>
    <textarea id="newSkuSP" placeholder="每行一条卖点"></textarea>
    <label>适合人群</label>
    <input id="newSkuTarget" placeholder="目标人群描述">
    <label>使用场景</label>
    <input id="newSkuScenes" placeholder="使用场景描述">
    <label>关键词（逗号分隔）</label>
    <input id="newSkuKw" placeholder="关键词1、关键词2">
    <div class="sku-modal-actions">
      <button onclick="skuCloseModal()">取消</button>
      <button class="primary" onclick="skuCreateNew()">创建</button>
    </div>
  </div>
</div>

<script>
let skuProducts = [];
let skuSelectedIdx = 0;

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function skuLoad() {
  try {
    const resp = await fetch('/api/products');
    const data = await resp.json();
    skuProducts = data.products || [];
    document.getElementById('skuCount').textContent = `共 ${skuProducts.length} 个 SKU`;
    skuRenderSidebar();
    if (skuProducts.length > 0) skuRenderDetail(skuSelectedIdx);
    else document.getElementById('skuDetail').innerHTML = '<div class="sku-detail-empty"><div style="font-size:36px;margin-bottom:10px;">📦</div><div>暂无产品，点击「+ 添加 SKU」开始</div></div>';
  } catch(e) {
    document.getElementById('skuDetail').innerHTML = '<div class="sku-detail-empty">加载失败: ' + esc(e.message) + '</div>';
  }
}

function skuRenderSidebar() {
  const sidebar = document.getElementById('skuSidebar');
  // Group by series
  const groups = {};
  skuProducts.forEach((p, i) => {
    const series = p.series || '未分类';
    if (!groups[series]) groups[series] = [];
    groups[series].push({ ...p, _idx: i });
  });

  let html = '';
  for (const [series, items] of Object.entries(groups)) {
    html += `<div class="sku-group-label">${esc(series)}</div>`;
    items.forEach(p => {
      html += `<div class="sku-sidebar-item${p._idx === skuSelectedIdx ? ' active' : ''}" onclick="skuSelect(${p._idx})">
        <div class="sku-name">${esc(p.nickname || p.name)}</div>
        <div class="sku-nick">${esc(p.formalName || p.name)}</div>
      </div>`;
    });
  }
  sidebar.innerHTML = html;
}

function skuSelect(idx) {
  skuSelectedIdx = idx;
  skuRenderSidebar();
  skuRenderDetail(idx);
}

function skuRenderDetail(idx) {
  const p = skuProducts[idx];
  if (!p) return;
  const detail = document.getElementById('skuDetail');

  let html = `<div class="sku-header">
    <div>
      <div class="sku-title">${esc(p.name)}</div>
      <div class="sku-subtitle">${esc(p.formalName || '')}${p.spec ? ' · ' + esc(p.spec) : ''}${p.price ? ' · ' + esc(p.price) : ''}</div>
    </div>
    ${p.series ? `<div class="sku-series-badge">${esc(p.series)}</div>` : ''}
  </div>`;

  // Basic info fields
  const fields = [
    ['nickname', '电商昵称'], ['tech', '核心技术'], ['form', '形态'],
    ['steps', '使用步骤'], ['targetUsers', '适合人群'], ['scenes', '使用场景'],
  ];
  html += '<div class="sku-section"><div class="sku-section-title">📋 基本信息</div>';
  fields.forEach(([key, label]) => {
    if (p[key]) {
      html += `<div class="sku-field">
        <span class="sku-field-label">${label}</span>
        <span class="sku-field-value" id="fv-${key}">${esc(p[key])}</span>
        <span class="sku-field-edit" onclick="skuEditField(${idx},'${key}','${label}')">✏️</span>
      </div>`;
    }
  });
  html += '</div>';

  // Selling points
  const sp = p.sellingPoints || [];
  if (sp.length > 0) {
    html += '<div class="sku-section"><div class="sku-section-title">🎯 核心卖点 <span class="sku-field-edit" style="opacity:0.4" onclick="skuEditSP(${idx})">✏️</span></div>';
    html += '<ul class="sku-selling-points">';
    sp.forEach(s => { html += `<li>${esc(s)}</li>`; });
    html += '</ul></div>';
  }

  // Detailed selling points
  const spd = p.sellingPointsDetailed || [];
  if (spd.length > 0) {
    html += '<div class="sku-section"><div class="sku-section-title">📝 视频文案卖点</div>';
    html += '<ul class="sku-selling-points">';
    spd.forEach(s => { html += `<li>${esc(s)}</li>`; });
    html += '</ul></div>';
  }

  // One-liner
  if (p.oneLiner) {
    html += `<div class="sku-section"><div class="sku-section-title">💬 一句话卖点</div>
      <div class="sku-field"><span class="sku-field-value" style="font-weight:600;color:#d4af69;">${esc(p.oneLiner)}</span>
        <span class="sku-field-edit" onclick="skuEditField(${idx},'oneLiner','一句话卖点')">✏️</span>
      </div></div>`;
  }

  // Ingredients table
  if (p.ingredients && p.ingredients.length > 0) {
    const headers = Object.keys(p.ingredients[0]);
    html += '<div class="sku-section"><div class="sku-section-title">🧪 核心成分</div>';
    html += '<table class="sku-table"><thead><tr>';
    headers.forEach(h => { html += `<th>${esc(h)}</th>`; });
    html += '</tr></thead><tbody>';
    p.ingredients.forEach(row => {
      html += '<tr>';
      headers.forEach(h => { html += `<td>${esc(row[h] || '')}</td>`; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  // Competitors table
  if (p.competitors && p.competitors.length > 0) {
    const headers = Object.keys(p.competitors[0]);
    html += '<div class="sku-section"><div class="sku-section-title">⚔️ 竞品对比</div>';
    html += '<table class="sku-table"><thead><tr>';
    headers.forEach(h => { html += `<th>${esc(h)}</th>`; });
    html += '</tr></thead><tbody>';
    p.competitors.forEach(row => {
      html += '<tr>';
      headers.forEach(h => { html += `<td>${esc(row[h] || '')}</td>`; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }

  // Keywords
  if (p.keywords) {
    html += '<div class="sku-section"><div class="sku-section-title">🏷️ 关键词</div><div class="sku-tags">';
    p.keywords.split(/[、,，]/).forEach(kw => {
      kw = kw.trim();
      if (kw) html += `<span class="sku-tag">${esc(kw)}</span>`;
    });
    html += '</div></div>';
  }

  // Notes
  if (p.notes) {
    html += `<div class="sku-section"><div class="sku-field"><span class="sku-field-label">备注</span><span class="sku-field-value" style="color:var(--text-muted);font-size:12px;">${esc(p.notes)}</span></div></div>`;
  }

  detail.innerHTML = html;
}

// Inline edit for simple fields
function skuEditField(idx, key, label) {
  const el = document.getElementById('fv-' + key);
  if (!el) return;
  const old = skuProducts[idx][key] || '';
  const editEl = el.closest('.sku-field');
  const input = document.createElement('input');
  input.className = 'sku-inline-input';
  input.value = old;
  el.replaceWith(input);
  input.focus();
  // Hide edit button
  const editBtn = editEl.querySelector('.sku-field-edit');
  if (editBtn) editBtn.style.display = 'none';

  const save = async () => {
    const newVal = input.value.trim();
    if (newVal !== old) {
      skuProducts[idx][key] = newVal;
      await skuSave(idx);
    }
    skuRenderDetail(idx);
  };
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = old; input.blur(); } });
}

async function skuSave(idx) {
  const p = skuProducts[idx];
  try {
    await fetch(`/api/products/${encodeURIComponent(p.name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p),
    });
  } catch(e) { alert('保存失败: ' + e.message); }
}

// Add SKU modal
function skuShowAddModal() { document.getElementById('skuModalOverlay').classList.add('show'); }
function skuCloseModal() { document.getElementById('skuModalOverlay').classList.remove('show'); }

async function skuCreateNew() {
  const name = document.getElementById('newSkuName').value.trim();
  if (!name) { alert('请输入 SKU 名称'); return; }
  const sp = document.getElementById('newSkuSP').value.trim();
  const body = {
    name,
    nickname: document.getElementById('newSkuNick').value.trim(),
    series: document.getElementById('newSkuSeries').value.trim(),
    tech: document.getElementById('newSkuTech').value.trim(),
    form: document.getElementById('newSkuForm').value.trim(),
    sellingPoints: sp ? sp.split('\n').map(s => s.trim()).filter(Boolean) : [],
    targetUsers: document.getElementById('newSkuTarget').value.trim(),
    scenes: document.getElementById('newSkuScenes').value.trim(),
    keywords: document.getElementById('newSkuKw').value.trim(),
  };
  try {
    const resp = await fetch('/api/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!data.success) { alert(data.detail || '创建失败'); return; }
    skuCloseModal();
    skuSelectedIdx = skuProducts.length;
    await skuLoad();
  } catch(e) { alert('创建失败: ' + e.message); }
}

// Init
skuLoad();
</script>
